<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#002117",
                    "outline-variant": "#44474d",
                    "on-primary": "#233148",
                    "surface-container-lowest": "#000d27",
                    "primary": "#b9c7e4",
                    "on-primary-fixed-variant": "#39475f",
                    "tertiary-fixed-dim": "#c1c7cf",
                    "surface-container-high": "#192a48",
                    "outline": "#8f9097",
                    "on-secondary-fixed-variant": "#0b513d",
                    "on-tertiary-fixed-variant": "#41474e",
                    "secondary": "#95d3ba",
                    "on-secondary": "#003829",
                    "tertiary-fixed": "#dde3eb",
                    "primary-fixed": "#d6e3ff",
                    "tertiary-container": "#141a1f",
                    "on-primary-container": "#74829d",
                    "on-secondary-container": "#83c2a9",
                    "surface": "#011230",
                    "primary-container": "#0a192f",
                    "background": "#011230",
                    "surface-dim": "#011230",
                    "surface-container-low": "#091b39",
                    "inverse-primary": "#515f78",
                    "tertiary": "#c1c7cf",
                    "on-tertiary-container": "#7c838a",
                    "primary-fixed-dim": "#b9c7e4",
                    "on-surface": "#d8e2ff",
                    "on-background": "#d8e2ff",
                    "secondary-fixed": "#b0f0d6",
                    "secondary-fixed-dim": "#95d3ba",
                    "surface-variant": "#253453",
                    "on-error-container": "#ffdad6",
                    "surface-tint": "#b9c7e4",
                    "surface-container-highest": "#253453",
                    "on-primary-fixed": "#0d1c32",
                    "on-surface-variant": "#c5c6cd",
                    "error": "#ffb4ab",
                    "inverse-surface": "#d8e2ff",
                    "secondary-container": "#0b513d",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#161c22",
                    "surface-container": "#0e1f3d",
                    "inverse-on-surface": "#20304f",
                    "error-container": "#93000a",
                    "surface-bright": "#293958"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "container-padding": "24px",
                    "board-margin": "32px",
                    "unit": "8px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["EB Garamond"],
                    "label-sm": ["Hanken Grotesk"],
                    "headline-lg": ["EB Garamond"],
                    "label-md": ["Hanken Grotesk"],
                    "headline-xl": ["EB Garamond"],
                    "body-md": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #011230;
            color: #d8e2ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(14, 31, 61, 0.7);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(185, 199, 228, 0.15);
        }
        input:focus + span {
            color: #95d3ba;
            text-shadow: 0 0 8px rgba(149, 211, 186, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface fixed top-0 w-full z-50 border-b border-outline-variant/20 shadow-[0_4px_20px_rgba(2,12,27,0.8)]">
<div class="flex justify-between items-center px-container-padding h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-tighter text-on-surface dark:text-on-surface uppercase">GRANDMASTER</h1>
</div>
<div class="h-10 w-10 rounded-full overflow-hidden border border-outline-variant/30">
<img alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXeT70SU4OppXY4QNo0vfbLXNZAX3ElCFsgbFTDny4iH_E__F8UAHPpDnuE-pvBqkx8c77vj2ynHXJuWdo1V99vyRKfHXMqhCuiyqktf0pYt9K5Io0VNAK45552-jHufg9eF6JwFpdzLavxlw3j1b71Wez_TkLUVhq0C51NB8Xc96FhDmG1jpqlQ9i6bzwOU8mn-tTr0LuFbBdoDp3Iu28VPS6ABA6rE6_PgnM2r6WNcNHXb1hW7BOp3PUJSM0VJgVUFJEsXiyWKpP"/>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center pt-16 pb-12 px-container-padding relative">
<!-- Atmospheric Background Image -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-30 grayscale contrast-125" data-alt="A cinematic, low-angle shot of a heavy Staunton chess king made of dark polished ebony wood resting on a marble board. The lighting is dramatic and moody, evocative of a midnight library with deep navy shadows and sharp silver highlights. The background is softly blurred, showing the silhouettes of other chess pieces under a single atmospheric spotlight, creating an elite and strategic ambiance in a Corporate Modern style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCiyOxz390pMEsJdb9F08LfLPESePN_tidKzrY7dDaNM7u3nanZD6myWPxMEXEOls14G5QfQVVuUt-KeO8HERNg7qnz6PixlrJOUe-JPstZ2SoBzVRgwiYfWwKv5l6Nn9fZqtdc4-xey_1JB-49mYawc6jrCNDL09t1ls0OTEZMRJF5cNeOVT5Bf65071Eqw8qH9fzFl5o2utCSzYJe0c6e2bOju170A1ymIgxG2DF6rfku73TNRuMUmbzL3Tb6upOR4V2oOjSPbUIq"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface via-transparent to-surface"></div>
</div>
<!-- Registration Card -->
<div class="relative z-10 w-full max-w-md glass-panel p-gutter md:p-board-margin rounded-xl shadow-[0_20px_50px_rgba(2,12,27,0.9)] border border-outline-variant/10">
<div class="text-center mb-8">
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-2">Join the Elite</h2>
<p class="font-body-md text-on-surface-variant italic">Enter the arena where masters are forged.</p>
</div>
<form class="space-y-6">
<!-- Full Name -->
<div class="relative">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant py-2 text-on-surface focus:ring-0 focus:border-secondary transition-all placeholder-transparent" id="fullname" name="fullname" placeholder=" " type="text"/>
<label class="absolute left-0 top-2 text-outline-variant transition-all peer-focus:-top-4 peer-focus:text-label-sm peer-focus:text-secondary peer-[:not(:placeholder-shown)]:-top-4 peer-[:not(:placeholder-shown)]:text-label-sm peer-[:not(:placeholder-shown)]:text-secondary uppercase tracking-widest font-label-sm" for="fullname">
                        Full Name
                    </label>
</div>
<!-- Email -->
<div class="relative">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant py-2 text-on-surface focus:ring-0 focus:border-secondary transition-all placeholder-transparent" id="email" name="email" placeholder=" " type="email"/>
<label class="absolute left-0 top-2 text-outline-variant transition-all peer-focus:-top-4 peer-focus:text-label-sm peer-focus:text-secondary peer-[:not(:placeholder-shown)]:-top-4 peer-[:not(:placeholder-shown)]:text-label-sm peer-[:not(:placeholder-shown)]:text-secondary uppercase tracking-widest font-label-sm" for="email">
                        Email Address
                    </label>
</div>
<!-- Password -->
<div class="relative">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant py-2 text-on-surface focus:ring-0 focus:border-secondary transition-all placeholder-transparent" id="password" name="password" placeholder=" " type="password"/>
<label class="absolute left-0 top-2 text-outline-variant transition-all peer-focus:-top-4 peer-focus:text-label-sm peer-focus:text-secondary peer-[:not(:placeholder-shown)]:-top-4 peer-[:not(:placeholder-shown)]:text-label-sm peer-[:not(:placeholder-shown)]:text-secondary uppercase tracking-widest font-label-sm" for="password">
                        Password
                    </label>
</div>
<!-- Confirm Password -->
<div class="relative">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant py-2 text-on-surface focus:ring-0 focus:border-secondary transition-all placeholder-transparent" id="confirm_password" name="confirm_password" placeholder=" " type="password"/>
<label class="absolute left-0 top-2 text-outline-variant transition-all peer-focus:-top-4 peer-focus:text-label-sm peer-focus:text-secondary peer-[:not(:placeholder-shown)]:-top-4 peer-[:not(:placeholder-shown)]:text-label-sm peer-[:not(:placeholder-shown)]:text-secondary uppercase tracking-widest font-label-sm" for="confirm_password">
                        Confirm Password
                    </label>
</div>
<!-- Terms -->
<div class="flex items-center gap-3">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-outline-variant bg-surface-container text-secondary focus:ring-secondary/20 transition-all cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<label class="font-label-sm text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-secondary hover:underline transition-all" href="#">Terms of Service</a> and <a class="text-secondary hover:underline transition-all" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Primary Action -->
<button class="w-full bg-secondary text-on-secondary font-label-md py-4 rounded shadow-lg hover:bg-secondary/90 hover:shadow-secondary/20 transition-all active:scale-[0.98] uppercase tracking-[0.2em] font-semibold" type="submit">
                    Create Account
                </button>
</form>
<!-- Separator -->
<div class="flex items-center my-8 gap-4">
<div class="flex-grow h-px bg-outline-variant/30"></div>
<span class="font-label-sm text-outline-variant uppercase">Or continue with</span>
<div class="flex-grow h-px bg-outline-variant/30"></div>
</div>
<!-- Social Registration -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 border border-outline-variant/40 py-3 rounded hover:bg-surface-variant/30 transition-all font-label-sm uppercase tracking-widest text-on-surface">
<span class="material-symbols-outlined text-[18px]">google</span>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 border border-outline-variant/40 py-3 rounded hover:bg-surface-variant/30 transition-all font-label-sm uppercase tracking-widest text-on-surface">
<span class="material-symbols-outlined text-[18px]">ios</span>
                    Apple
                </button>
</div>
<p class="text-center mt-8 font-body-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-semibold hover:text-secondary transition-colors" href="#">Sign In</a>
</p>
</div>
</main>
<!-- BottomNavBar (Suppressed for focused journey as per rule, but following JSON if top-level) -->
<!-- The user is in a "Transactional" screen (Registration), so navigation should be suppressed according to Shell Visibility & Relevance mandate. -->
<footer class="mt-auto py-6 text-center z-10 border-t border-outline-variant/10">
<p class="font-label-sm text-outline-variant/60 tracking-widest uppercase">© 2024 Grandmaster Chess Federation</p>
</footer>
</body></html>
