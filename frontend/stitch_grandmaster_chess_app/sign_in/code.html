<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #011230;
            color: #d8e2ff;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#002117",
                      "outline-variant": "#44474d",
                      "on-primary": "#233148",
                      "surface-container-lowest": "#000d27",
                      "primary": "#b9c7e4",
                      "on-primary-fixed-variant": "#39475f",
                      "tertiary-fixed-dim": "#c1c7cf",
                      "surface-container-high": "#192a48",
                      "outline": "#8f9097",
                      "on-secondary-fixed-variant": "#0b513d",
                      "on-tertiary-fixed-variant": "#41474e",
                      "secondary": "#95d3ba",
                      "on-tertiary": "#2b3137",
                      "tertiary-fixed": "#dde3eb",
                      "primary-fixed": "#d6e3ff",
                      "tertiary-container": "#141a1f",
                      "on-primary-container": "#74829d",
                      "on-secondary-container": "#83c2a9",
                      "surface": "#011230",
                      "primary-container": "#0a192f",
                      "background": "#011230",
                      "surface-dim": "#011230",
                      "surface-container-low": "#091b39",
                      "inverse-primary": "#515f78",
                      "tertiary": "#c1c7cf",
                      "on-tertiary-container": "#7c838a",
                      "primary-fixed-dim": "#b9c7e4",
                      "on-surface": "#d8e2ff",
                      "on-background": "#d8e2ff",
                      "secondary-fixed": "#b0f0d6",
                      "secondary-fixed-dim": "#95d3ba",
                      "surface-variant": "#253453",
                      "on-secondary": "#003829",
                      "on-error-container": "#ffdad6",
                      "surface-tint": "#b9c7e4",
                      "surface-container-highest": "#253453",
                      "on-primary-fixed": "#0d1c32",
                      "on-surface-variant": "#c5c6cd",
                      "error": "#ffb4ab",
                      "inverse-surface": "#d8e2ff",
                      "secondary-container": "#0b513d",
                      "on-error": "#690005",
                      "on-tertiary-fixed": "#161c22",
                      "surface-container": "#0e1f3d",
                      "inverse-on-surface": "#20304f",
                      "error-container": "#93000a",
                      "surface-bright": "#293958"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "container-padding": "24px",
                      "board-margin": "32px",
                      "unit": "8px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["EB Garamond"],
                      "label-sm": ["Hanken Grotesk"],
                      "headline-lg": ["EB Garamond"],
                      "label-md": ["Hanken Grotesk"],
                      "headline-xl": ["EB Garamond"],
                      "body-md": ["Hanken Grotesk"],
                      "body-lg": ["Hanken Grotesk"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center bg-background">
<!-- Top Navigation Shell Suppressed per Rule (Transactional Screen) -->
<main class="w-full max-w-md px-container-padding py-12 flex flex-col items-center">
<!-- Logo Branding -->
<div class="mb-12 text-center">
<h1 class="font-headline-xl text-headline-xl tracking-tighter uppercase text-on-surface">
                GRANDMASTER
            </h1>
<p class="font-label-sm text-label-sm text-outline tracking-widest mt-2">
                STRATEGIC EXCELLENCE
            </p>
</div>
<!-- Login Container -->
<div class="w-full bg-surface-container-low p-8 rounded-xl shadow-[0_4px_30px_rgba(2,12,27,0.8)] border-t border-secondary/10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-8 text-center">
                Sign In
            </h2>
<form class="space-y-6">
<!-- Email/Username Field -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-outline-variant mb-1 ml-1">EMAIL OR USERNAME</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-1 focus:ring-0 focus:border-secondary transition-colors text-on-surface font-body-md text-body-md placeholder:text-outline-variant/50" placeholder="Enter your handle" type="text"/>
</div>
<!-- Password Field -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-outline-variant mb-1 ml-1">PASSWORD</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-1 focus:ring-0 focus:border-secondary transition-colors text-on-surface font-body-md text-body-md placeholder:text-outline-variant/50" placeholder="••••••••" type="password"/>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between pt-2">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative w-4 h-4 rounded-sm border border-outline-variant group-hover:border-secondary transition-colors overflow-hidden">
<input class="absolute inset-0 opacity-0 peer cursor-pointer" type="checkbox"/>
<div class="absolute inset-0 bg-secondary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-fixed-dim transition-colors uppercase" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Primary Action -->
<button class="w-full bg-secondary hover:bg-secondary-fixed-dim text-on-secondary-fixed font-label-md text-label-md py-4 rounded-lg transition-all active:scale-95 shadow-lg shadow-secondary/10 uppercase tracking-widest mt-4" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-low px-4 text-outline font-label-sm text-label-sm">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center space-x-2 py-3 border border-outline-variant/40 rounded-lg hover:border-secondary/50 transition-colors active:scale-95 group bg-surface-container-lowest/30">
<span class="material-symbols-outlined text-on-surface group-hover:text-secondary transition-colors" style="font-size: 20px;">google</span>
<span class="font-label-sm text-label-sm text-on-surface uppercase tracking-wider">Google</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 border border-outline-variant/40 rounded-lg hover:border-secondary/50 transition-colors active:scale-95 group bg-surface-container-lowest/30">
<span class="material-symbols-outlined text-on-surface group-hover:text-secondary transition-colors" style="font-size: 20px;">ios</span>
<span class="font-label-sm text-label-sm text-on-surface uppercase tracking-wider">Apple</span>
</button>
</div>
</div>
<!-- Footer Call to Action -->
<div class="mt-12 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to the elite circle? 
                <a class="text-secondary font-label-md text-label-md ml-2 hover:underline transition-all uppercase tracking-wider" href="#">
                    Create an account
                </a>
</p>
</div>
</main>
<!-- Decorative Elements (Midnight Royal Aesthetic) -->
<div class="fixed top-0 right-0 p-12 opacity-5 pointer-events-none hidden lg:block">
<span class="material-symbols-outlined text-[320px] text-primary" style="font-variation-settings: 'wght' 100;">castle</span>
</div>
<div class="fixed bottom-0 left-0 p-12 opacity-5 pointer-events-none hidden lg:block">
<span class="material-symbols-outlined text-[240px] text-secondary" style="font-variation-settings: 'wght' 100;">stars</span>
</div>
<!-- Background Image with prompt as per instructions -->
<div class="fixed inset-0 -z-10 opacity-30 grayscale mix-blend-overlay">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-background"></div>
<img alt="" class="w-full h-full object-cover" data-alt="A moody, high-end photograph of a professional wooden chess set positioned on a dark polished mahogany table. The scene is lit by a single overhead spotlight, creating deep shadows and high-contrast highlights on the carved figures. The color palette is dominated by deep navy blues and blacks, with subtle emerald green light catching the edges of the pieces. The atmosphere is quiet, intense, and intellectual, evoking a private library at midnight." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgpSqT8utlsXQAINdexf84ZZuAVr0XNE08LD39zPZL8ljSwx2pNePJzEAxG68FyX1DLpqzY4HhOgRE4plqu5A0Ox-_5BfaZR674lPI0C0GHeYcvUSYD1kze4SF41-UMeopOiYl4o7B6H7rdo2lEvBGQH2BPVblF6vdpQ3zlmgJHFThZJyoNbMHXEhW-pQhCGUXAJYTMmDl6PkHwab1x2foD6alNXp1gVVsE_UQfPqpv7BI3TBllU9Mhv_vCqMq9momSIyVohpqAe9m"/>
</div>
</body></html>
